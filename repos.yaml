# このリポジトリ（localization_workspace）の中に置く、単独のリポジトリの一覧（.gitignore で外している）。
# ./clone_repos.sh で、無いものを clone する（ある場合は何もしない）。
repos:
  - {path: docker,                   url: git@github.com:MaeharaTakumi/localizer_docker.git,      branch: main}
  - {path: src/ekf_localizer,        url: git@github.com:MaeharaTakumi/ekf_localizer.git,         branch: humble}
  - {path: src/lidar_localization,   url: git@github.com:MaeharaTakumi/lidar_localization.git,    branch: humble}
  - {path: src/localization_bringup, url: https://github.com/MaeharaTakumi/localization_bringup.git, branch: humble}
  - {path: src/localization_tools,   url: git@github.com:MaeharaTakumi/localization_tools.git,    branch: main}
  - {path: src/whill_odometry,       url: git@github.com:MaeharaTakumi/whill_odometry.git,        branch: humble}
  - {path: src/rviz2_bag,            url: https://github.com/shikishima-TasakiLab/rviz2_bag.git,  branch: main}
